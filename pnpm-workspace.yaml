packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'

# Load-bearing, not tidiness: `.openapi()` only exists on schemas built from the
# zod instance that @hono/zod-openapi extends. Two zod copies (one for
# drizzle-zod, one for @hono/zod-openapi) silently strips `.openapi()` at
# runtime from every derived schema. This forces a single instance.
overrides:
  zod: '^4.4.0'
  # Same reasoning as zod, different symptom: two React copies make every hook
  # in @repo/ui throw "Invalid hook call" the moment the dashboard renders a
  # primitive. One instance, pinned to what Expo SDK 57 expects.
  react: '19.2.3'
  react-dom: '19.2.3'

allowBuilds:
  esbuild: true
  workerd: true

# Expo's packages reach for peers they do not declare (@expo/log-box,
# expo-font/build/server, @expo/router-server), which pnpm's symlinked layout
# hides from Metro — the dashboard cannot bundle at all without this. Settings
# live here rather than .npmrc because pnpm 11 reads its config from this file.
nodeLinker: hoisted

autoInstallPeers: true
strictPeerDependencies: false
minimumReleaseAgeExclude:
  - '@hono/zod-openapi@1.5.3'
  - '@scalar/client-side-rendering@0.3.7'
  - '@scalar/hono-api-reference@0.11.14'
  - '@scalar/types@0.18.0'
  - hono@4.13.2
  - miniflare@5.20260811.0-alpha
  - wrangler@4.122.0
