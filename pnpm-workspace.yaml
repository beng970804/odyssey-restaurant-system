packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'

# Load-bearing, not tidiness: `.openapi()` only exists on schemas built from the
# zod instance that @hono/zod-openapi extends. Two zod copies (one for
# drizzle-zod, one for @hono/zod-openapi) silently strips `.openapi()` at
# runtime from every derived schema. This forces a single instance.
overrides:
  zod: '^4.4.0'

allowBuilds:
  esbuild: true
  workerd: true

autoInstallPeers: true
strictPeerDependencies: false
minimumReleaseAgeExclude:
  - '@hono/zod-openapi@1.5.3'
  - '@scalar/client-side-rendering@0.3.7'
  - '@scalar/hono-api-reference@0.11.14'
  - '@scalar/types@0.18.0'
  - hono@4.13.2
  - miniflare@5.20260811.0-alpha
  - wrangler@4.122.0
