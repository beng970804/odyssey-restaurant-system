name: CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      # Turns "the contract is generated, not duplicated" from a claim into
      # something the repo proves on every push: if the committed OpenAPI
      # document or the generated client no longer matches the Drizzle schema,
      # this fails. No database needed — PGlite runs in-process and
      # gen:contract never opens a connection.
      - name: Contract is in sync with the schema
        run: pnpm gen:contract && git diff --exit-code
